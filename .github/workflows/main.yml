name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race, but never cancel one that is already publishing.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # `npm ci` rather than `npm i` — the lockfile pins @amplib/* to the exact
      # published builds this was tested against. A floating install would let a
      # patch release change the codec under a deploy nobody triggered.
      - run: npm ci

      # Typecheck is deliberately absent. `npm run typecheck` currently reports
      # 6 pre-existing errors in this repo's own code, so gating on it here
      # would block every deploy. Fix those first, then add it as a step.
      - run: npm run build

      # modulo used to be a subdirectory of amplib.app, built out of
      # another-machine/public-library and moved into ./site/modulo by that
      # repo's workflow. It has its own subdomain now, so it builds at the root
      # and needs no --public-url. amplib.app/modulo forwards here.
      #
      # This CNAME does NOT set the custom domain. That is a repo setting, and
      # for an Actions-based deploy GitHub ignores the file in the artifact —
      # the first deploy here succeeded with this step in place and still left
      # the domain unset, until it was set through the API. The file is kept
      # only so the domain is visible in the diff and survives a branch-based
      # fallback. To change the domain you must also change the repo setting.
      - run: echo "modulo.amplib.app" > dist/CNAME

      # enablement: true so a fresh clone of this repo deploys without anyone
      # first clicking through Settings → Pages. Without it the very first run
      # fails with "Get Pages site failed" and nothing explains why.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
      - id: deployment
        uses: actions/deploy-pages@v4
